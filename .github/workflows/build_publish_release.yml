name: Build, Publish, and Release

on:
  push:
    branches:
      - main # stable
      - develop # beta
      - 'release/**' # rc
      - 'hotfix/**' # hotfix
  workflow_dispatch:

permissions:
  contents: write # нужно для пуша тегов

jobs:
  infer-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nyx.outputs.version }}
    steps:
      - name: "✅ Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "🧾 Set git user"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "🚀 Nyx release (tag + changelog)"
        id: nyx
        uses: mooltiverse/nyx@main
        env:
          NYX_VERBOSITY: 'WARN'
        with:
          configurationFile: 'build-configuration/.nyx.json'
          command: 'publish'
          changelogPath: CHANGELOG.md

      - name: "🟢 Release version is ${{ steps.nyx.outputs.version }}"
        if: ${{ steps.nyx.outputs.version != '' }}
        run: echo The release version is ${{ steps.nyx.outputs.version }}

      - name: "📖 Read Changelog for Release Notes"
        if: ${{ steps.nyx.outputs.version != '' }}
        id: changelog
        run: |
          awk '/^## / {found++} found == 1 {print}' CHANGELOG.md > latest-changelog.md

      - name: "🌊 Create GitHub Release"
        if: ${{ steps.nyx.outputs.version != '' }}
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: ${{ steps.nyx.outputs.version }}
          name: Release ${{ steps.nyx.outputs.version }}
          bodyFile: latest-changelog.md
          prerelease: ${{ contains(steps.nyx.outputs.version, '-beta') || contains(steps.nyx.outputs.version, '-rc') }}

  build-and-publish:
    if: ${{ needs.infer-release.outputs.version != '' }}
    runs-on: macos-latest
    needs: infer-release
    environment: Maven
    steps:
      - name: "✅ Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # чтобы был доступен тег, если нужен в сборке

      - name: "⚙️ Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: "⚙️ Setup Gradle"
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.13

      - name: "🌎 Publish with Gradle"
        run: ./gradlew :kotlinx-datetime-ext:publish --no-configuration-cache --build-cache --daemon --parallel --scan
        env:
          VERSION: ${{ needs.infer-release.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
